<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countree</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"/>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="toolbar">
    <span class="app-title">Countree</span>
    <button id="btn-mode" class="btn btn-mode active">+ Add Mode</button>
    <button id="btn-area" class="btn btn-mode" title="Click points to outline an area; click the first point to close it">▱ Draw Area</button>
    <button id="btn-save" class="btn">Save CSV</button>
    <button id="btn-load" class="btn">Load CSV</button>
    <input type="file" id="file-input" accept=".csv" style="display:none" />

    <div class="filter-bar">
      <label class="filter-label" for="group-select">Group</label>
      <select id="group-select" class="provider-select">
        <option value="">All groups</option>
      </select>
      <button id="btn-group-list" class="btn" title="List all groups">☰ Groups</button>
      <label class="filter-label" title="Replace points with per-group totals: trees, area (dönüm) and trees/dönüm">
        <input type="checkbox" id="stats-enable" /> Stats view
      </label>
      <label class="filter-label" title="Show only points that have another point within this distance">
        <input type="checkbox" id="dup-enable" /> Close points
      </label>
      <input type="range" id="dup-distance" min="0.1" max="20" step="0.1" value="1" disabled />
      <span id="dup-distance-value" class="filter-value">1.0 m</span>
    </div>

    <div class="provider-bar">
      <span class="provider-label">Satellite</span>
      <select id="provider-select" class="provider-select">
        <option value="google_unofficial">Google (no key)</option>
        <option value="esri">ESRI World Imagery (no key)</option>
        <option value="mapbox">Mapbox</option>
        <option value="google">Google Maps API</option>
        <option value="here">HERE Maps</option>
      </select>
      <input id="api-key-input" class="api-key-input" type="text" placeholder="Paste API key…" style="display:none" />
      <button id="api-key-apply" class="btn btn-apply" style="display:none">Apply</button>
    </div>

    <div class="help-links">
      <span class="provider-label">Help</span>
      <a href="docs/manual.en.md" target="_blank" rel="noopener" title="User manual (English)">EN</a>
      <a href="docs/manual.tr.md" target="_blank" rel="noopener" title="Kullanım kılavuzu (Türkçe)">TR</a>
    </div>
  </header>

  <div class="main">
    <div id="map"></div>
    <aside class="sidebar">
      <div class="sidebar-header">
        <span>Points</span>
        <span id="point-count" class="point-count">0</span>
      </div>
      <div class="table-wrapper">
        <table id="points-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Description</th>
              <th>Latitude</th>
              <th>Longitude</th>
              <th>Groups</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="points-tbody"></tbody>
        </table>
        <div id="empty-state" class="empty-state">
          Click on the map to add a point
        </div>
      </div>
    </aside>
  </div>

  <div id="imagery-date" class="imagery-date" style="display:none">
    <span class="imagery-label">Imagery date</span>
    <span id="imagery-date-value" class="imagery-date-value">—</span>
  </div>

  <div id="group-modal" class="modal-overlay" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <span>Groups</span>
        <button id="group-modal-close" class="modal-close" title="Close">×</button>
      </div>
      <table class="modal-table">
        <thead>
          <tr><th>Name</th><th>Points</th><th>Area (dönüm)</th><th>Trees/dönüm</th><th>Description</th></tr>
        </thead>
        <tbody id="group-modal-tbody"></tbody>
      </table>
      <div id="group-modal-empty" class="empty-state">No groups yet.</div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
